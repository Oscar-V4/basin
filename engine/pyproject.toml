[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basin-engine"
version = "0.1.0"
description = "Basin — context configuration management for AI collaboration (engine)"
requires-python = ">=3.10"
dependencies = []  # stdlib only on the hot path

[project.scripts]
basin = "basin.__main__:main"

[tool.setuptools]
packages = ["basin"]

[tool.setuptools.package-data]
basin = ["schema.sql"]
