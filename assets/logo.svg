<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Basin">
  <defs>
    <pattern id="dense" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="2.4" height="2.4" fill="#ffffff"/>
    </pattern>
    <clipPath id="bowl">
      <path d="M28 62 A32 28 0 0 0 92 62 Z"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#0b0b0c"/>
  <g clip-path="url(#bowl)">
    <rect x="20" y="60" width="80" height="40" fill="url(#dense)"/>
  </g>
  <!-- settling pixels above the basin -->
  <g fill="#ffffff">
    <rect x="34" y="40" width="2.4" height="2.4"/>
    <rect x="46" y="34" width="2.4" height="2.4"/>
    <rect x="58" y="30" width="2.4" height="2.4"/>
    <rect x="70" y="35" width="2.4" height="2.4"/>
    <rect x="82" y="41" width="2.4" height="2.4"/>
    <rect x="40" y="48" width="2.4" height="2.4"/>
    <rect x="52" y="44" width="2.4" height="2.4"/>
    <rect x="64" y="43" width="2.4" height="2.4"/>
    <rect x="76" y="47" width="2.4" height="2.4"/>
    <rect x="60" y="52" width="2.4" height="2.4"/>
    <rect x="48" y="54" width="2.4" height="2.4"/>
    <rect x="72" y="54" width="2.4" height="2.4"/>
  </g>
</svg>
